# Nginx 配置 - Embodied Marketing
# 文件位置: /etc/nginx/sites-available/embodied-marketing
# 启用命令: ln -sf /etc/nginx/sites-available/embodied-marketing /etc/nginx/sites-enabled/
# 重载命令: nginx -t && systemctl reload nginx

# ==========================================
# 方案1：使用域名访问（推荐）
# ==========================================
server {
    listen 80;
    server_name monitor.your-domain.com;  # 替换为你的域名

    # 飞书回调需要较长的超时时间
    client_max_body_size 10M;
    proxy_read_timeout 90s;
    proxy_connect_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 静态资源缓存
    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

# ==========================================
# 方案2：使用 IP + 端口（无域名时）
# ==========================================
# 如果没有域名，可以直接通过 http://101.200.222.139:3001 访问
# 无需配置 Nginx

